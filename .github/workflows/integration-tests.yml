name: Integration Tests
on:
  workflow_run:
    workflows: ['Continuous Integration']
    types: [completed]
  workflow_dispatch:
permissions:
  actions: read
jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Require Continuous Integration Success
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
        run: |
          echo "Continuous Integration did not succeed (conclusion: ${{ github.event.workflow_run.conclusion }})."
          exit 1

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: osmosis-kakasi-artifacts
          path: target
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || github.run_id }}

      - name: Install Osmosis
        run: |
          sudo apt-get update -y
          sudo apt-get install -y osmosis

      - name: Install Plugin
        run: |
          mkdir -p ~/.openstreetmaps/osmosis/plugins
          unzip -o target/*-plugin.zip -d ~/.openstreetmaps/osmosis/plugins

      - name: Verify Plugin Loads
        run: osmosis -p org.villseriol.osmosis.version.VersionPluginLoader --read-empty --oss-version-0.6

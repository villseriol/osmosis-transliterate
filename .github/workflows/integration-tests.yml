name: Integration Tests
on: [push, pull_request]
jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Package
        run: mvn clean package

      - name: Get Final Artifact Name
        id: get-final-name
        run: |
          FINAL_NAME=$(mvn help:evaluate -Dexpression=project.build.finalName -q -DforceStdout)

          echo "final_name=$FINAL_NAME" >> $GITHUB_OUTPUT

      - name: Install Osmosis
        run: |
          sudo apt-get update -y
          sudo apt-get install -y osmosis

      - name: Install Plugin
        run: |
          mkdir -p ~/.openstreetmaps/osmosis/plugins
          unzip -o target/${{ steps.get-final-name.outputs.final_name }}-plugin.zip \
            -d ~/.openstreetmaps/osmosis/plugins

      - name: Verify Plugin Loads
        run: osmosis --read-empty --oss-version-0.6
